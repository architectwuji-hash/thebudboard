<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>TheBudBoard</title>
    <link rel="stylesheet" href="/src/style.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <canvas id="game" aria-label="Game canvas"></canvas>
    <canvas id="ui-overlay" aria-label="Game UI overlay"></canvas>
    <div id="game-over" class="hidden" role="dialog" aria-modal="true" aria-labelledby="game-over-title">
      <div class="game-over-card">
        <h1 id="game-over-title">Game Over</h1>
        <p id="game-over-message">Your base was destroyed.</p>
        <p id="game-over-score"></p>
        <p class="game-over-hint" id="game-over-hint">Tap anywhere or press Enter to play again</p>
      </div>
    </div>
    <div id="hud" aria-live="polite">
      <span id="hud-wave">Wave: 1</span>
      <span id="hud-score">Score: 0</span>
      <span id="hud-base-hp">Base HP: 100</span>
      <span id="hud-player-hp">Player HP: 100</span>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
