# Optional: deploy via Wrangler when Git-connected Cloudflare Pages is unavailable.
# Set repo variable CLOUDFLARE_PAGES_DEPLOY=true and secrets CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.
# Primary path: Cloudflare Git integration builds on push to main (see DEPLOY.md).
name: Cloudflare Pages
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  deploy:
    if: ${{ vars.CLOUDFLARE_PAGES_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.node-version
      - name: Build Vite game
        run: cd frontend && npm ci && npm run build
      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy frontend/.next --project-name=thebudboard --branch=main
